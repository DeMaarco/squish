[package]
name = "squish"
version = "0.1.0"
description = "Squish - A desktop compression app"
authors = ["you"]
edition = "2021"

[lib]
name = "squish_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
sevenz-rust2 = "0.21"
zip = { version = "2", default-features = false, features = ["deflate-zlib", "time"] }
zstd = "0.13"
walkdir = "2"
tar = "0.4"
